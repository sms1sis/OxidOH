[package]
name = "oxidoh"
version = "0.4.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["rustls", "socks", "http2", "gzip", "deflate"], default-features = false }
hickory-resolver = "0.26.1" # Formerly trust-dns
odoh-rs = "1.0.4"
dnsstamps = "0.1.10"
anyhow = "1.0.102"
bytes = "1.11.1"
jni = { version = "0.22.4", optional = true }
android_logger = "0.15.1"
log = "0.4.30"
base64 = "0.22.1"
rand = "0.9.0"
futures-util = "0.3.32"
hex = "0.4.3"
tokio-util = "0.7.18"
chrono = "0.4.44"
rustls-platform-verifier = { version = "0.7.0", features = ["jni"] }
tracing = "0.1.44"
clap = { version = "4.6.1", features = ["derive"] }
tracing-subscriber = "0.3.23"
regex = "1.12.3"



[features]
default = ["jni"]
jni = ["dep:jni"]
http3 = ["reqwest/http3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
